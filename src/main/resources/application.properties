spring.application.name=analytics-service

server.port=8083

#Perfil
spring.profiles.active=${PERFIL_SPRING}

# Eureka
eureka.client.service-url.defaultZone=http://eureka:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# MySQL
spring.datasource.url=jdbc:mysql://mysql:3306/analytics
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# Kafka
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=analytics-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Spring AI / Groq
spring.ai.openai.api-key=${API_IA}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.model=openai/gpt-oss-120b
spring.ai.openai.chat.temperature=0.3

# Rate Limiting
resilience4j.ratelimiter.instances.report.limit-for-period=5
resilience4j.ratelimiter.instances.report.limit-refresh-period=1m
resilience4j.ratelimiter.instances.report.timeout-duration=0s

resilience4j.ratelimiter.instances.aiReport.limit-for-period=1
resilience4j.ratelimiter.instances.aiReport.limit-refresh-period=10m
resilience4j.ratelimiter.instances.aiReport.timeout-duration=0s

# Almacenamiento de reportes
report.storage.local.path=${REPORT_STORAGE_LOCAL_PATH:./reports}
report.storage.s3.bucket=${REPORT_STORAGE_S3_BUCKET}
report.storage.s3.region=${REPORT_STORAGE_S3_REGION}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}